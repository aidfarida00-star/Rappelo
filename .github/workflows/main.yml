name: Construire Rappello

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire l'application
        run: |
          DIR=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          echo "Projet trouve dans : $DIR"
          cd "$DIR"
          npm install
          npm run android:init
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Rappello.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rappello-application-android
          path: Rappello.apk
