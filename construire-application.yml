name: Construire l'application Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les outils
        run: npm install
      - name: Créer le projet Android
        run: npm run android:init
      - name: Construire l'application
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Préparer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rappello.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rappello-application-android
          path: Rappello.apk
