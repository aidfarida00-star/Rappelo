<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>RappelMe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Cairo:wght@500;600;700;800&display=swap">
<style>
/* Layout : une colonne d'application (560px max), carte « prochain rappel », alerte stock, liste horaire dépliable, bouton flottant. */
:root{
  --bg:#F3F5FC; --surface:#FFFFFF; --surface-2:#EBEEF8; --ink:#1D2142; --muted:#5F6589; --line:#DFE3F1;
  --accent:#4F46E5; --accent-ink:#FFFFFF;
  --med:#E23D63; --med-soft:#FDE4EA;
  --rdv:#1583CF; --rdv-soft:#DFF0FB;
  --tache:#C87800; --tache-soft:#FFF0D2;
  --ok:#1E9A65; --ok-soft:#DDF5EA;
  --late:#D2452B; --warn-soft:#FFEBD9;
  --pri:#0B7F7A; --pri-soft:#D9F3F1;
  --on-color:#FFFFFF;
  --shadow:0 6px 24px rgba(40,46,110,.10);
  --f-display:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11132A; --surface:#1B1E3B; --surface-2:#242850; --ink:#EEF0FF; --muted:#A6ABCF; --line:#2E3260;
  --accent:#8C84FF; --accent-ink:#11132A;
  --med:#FF6E8E; --med-soft:#3A1D2E; --rdv:#4FB4F6; --rdv-soft:#15304C; --tache:#FFB83D; --tache-soft:#3A2D12;
  --ok:#3ECD8D; --ok-soft:#163A2C; --pri:#4FD1C5; --pri-soft:#123B3A; --late:#FF7A5C; --warn-soft:#3A2418; --on-color:#12142A; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11132A; --surface:#1B1E3B; --surface-2:#242850; --ink:#EEF0FF; --muted:#A6ABCF; --line:#2E3260;
  --accent:#8C84FF; --accent-ink:#11132A;
  --med:#FF6E8E; --med-soft:#3A1D2E; --rdv:#4FB4F6; --rdv-soft:#15304C; --tache:#FFB83D; --tache-soft:#3A2D12;
  --ok:#3ECD8D; --ok-soft:#163A2C; --pri:#4FD1C5; --pri-soft:#123B3A; --late:#FF7A5C; --warn-soft:#3A2418; --on-color:#12142A; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
:root[lang="ar"]{ --f-display:"Cairo","Fredoka",system-ui,sans-serif; --f-body:"Cairo","Nunito",system-ui,sans-serif; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* Marque et langues */
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:"Fredoka",var(--f-display);font-size:24px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:rotate(-8deg)}
.langs{display:flex;gap:4px;background:var(--surface);border-radius:99px;padding:4px}
.langs button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langs .ar{font-family:"Cairo",sans-serif}

/* En-tête */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.day{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
:root[lang="ar"] .day{letter-spacing:0}
.date{font-size:clamp(28px,7vw,36px);font-weight:600;line-height:1.1}
.clock{font-family:"Fredoka",var(--f-display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}

.unlock{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:2px dashed var(--accent);background:var(--surface);border-radius:20px;padding:16px 18px}
.unlock .ico{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.unlock b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.unlock span{color:var(--muted);font-size:15px}

.next{border-radius:26px;padding:20px 22px;color:var(--on-color);display:flex;gap:16px;align-items:center;box-shadow:var(--shadow);background:var(--accent)}
.next.med{background:var(--med)} .next.rdv{background:var(--rdv)} .next.tache{background:var(--tache)} .next.pri{background:var(--pri)} .next.allok{background:var(--ok)}
.next .big{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.next small{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;opacity:.9}
.next h2{font-size:24px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.next p{margin:2px 0 0;font-weight:700;opacity:.95}
.next>div:last-child{min-width:0}

/* Prières */
.prayers{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.prhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prhead h3{font-size:18px;font-weight:600;color:var(--pri);display:flex;align-items:center;gap:8px}
.prhead span{font-size:14px;color:var(--muted);font-weight:700}
.prgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.prc{border-radius:14px;background:var(--pri-soft);padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px}
.prc b{font-size:13px;font-weight:800;color:var(--pri);overflow-wrap:anywhere}
.prc span{font-family:"Fredoka",var(--f-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prc.past{opacity:.5}
.prc.nx{background:var(--pri)} .prc.nx b,.prc.nx span{color:var(--on-color)}
.prfoot{font-size:13px;color:var(--muted)}
.box.pri h3{color:var(--pri)}
.prgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.prgrid2{grid-template-columns:1fr}.prc span{font-size:16px}}

/* Sons */
.sndrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.sndrow label{grid-column:1 / -1;font-weight:700;font-size:14px;color:var(--muted)}
.sndrow select{font-size:16px;padding:10px 12px}
.sndrow .mini{background:var(--surface-2);padding:12px 14px}
.sndrows{display:flex;flex-direction:column;gap:10px}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.seg3 button{padding:10px 4px;font-size:15px}
.subt{font-weight:800;font-size:15px;margin-top:4px}

/* Annonce de la prière */
.phlist{display:flex;flex-direction:column;gap:8px}
.ph{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:2px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer}
.ph.on{border-color:var(--pri);background:var(--pri-soft)}
.ph input{width:22px;height:22px;padding:0;accent-color:var(--pri)}
.ph .phtxt b{display:block;font-family:"Cairo",var(--f-body);font-size:20px;font-weight:700;line-height:1.3}
.ph .phtxt small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.ph .mini{background:var(--surface)}
.ph.fajrrow{grid-template-columns:minmax(0,1fr) auto auto;cursor:default}
.ph.fajrrow .phtxt b{font-size:16px}
.ph.fajrrow .phtxt{grid-column:1 / -1}
.ph.fajrrow .mini{grid-column:2}
.ph.fajrrow .switch{grid-column:3}
:root[dir="ltr"] .ph .phtxt b[dir="rtl"]{text-align:left}
.alert .callar{font-family:"Cairo",sans-serif;font-size:clamp(26px,8vw,36px);font-weight:700;line-height:1.3}

/* Stock */
.stock{background:var(--warn-soft);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.stock h3{font-size:18px;font-weight:600;color:var(--late);display:flex;align-items:center;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.srow b{font-weight:800}
.srow span{color:var(--muted);font-size:15px}
.mini{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:15px;background:var(--surface);color:var(--ink)}

.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.progress b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:800;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Liste */
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.item{background:var(--surface);border-radius:20px;padding:12px 12px;border:2px solid transparent;display:flex;flex-direction:column;gap:10px}
.item.isnext{border-color:var(--accent)}
.main{display:grid;grid-template-columns:62px 48px 1fr 52px;align-items:center;gap:12px}
.t{font-family:"Fredoka",var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.bubble{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.med .bubble{background:var(--med-soft);color:var(--med)}
.rdv .bubble{background:var(--rdv-soft);color:var(--rdv)}
.tache .bubble{background:var(--tache-soft);color:var(--tache)}
.pri .bubble{background:var(--pri-soft);color:var(--pri)}
.body{min-width:0;text-align:start;background:none;border:0;padding:0}
.ttl{font-weight:800;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tag{font-size:12px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
.tag.late{background:var(--late);color:var(--on-color)}
.tag.nx{background:var(--accent);color:var(--accent-ink)}
.tag.low{background:var(--warn-soft);color:var(--late)}
.tag.stk{background:var(--med-soft);color:var(--med)}
.tag.vox{background:var(--ok-soft);color:var(--ok)}
.check{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;transition:.2s}
.check:hover{border-color:var(--ok)}
.item.done .check{background:var(--ok);border-color:var(--ok);color:var(--on-color)}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.item.done .t,.item.done .bubble{opacity:.45}

.prepbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--rdv-soft);border-radius:14px;padding:8px 8px 8px 14px;font-weight:800;font-size:15px;color:var(--rdv)}
:root[dir="rtl"] .prepbar{padding:8px 14px 8px 8px}
.prepbar .mini{background:var(--surface);color:var(--rdv)}
.prep{display:flex;flex-direction:column;gap:10px;padding:2px 4px}
.prep h4{margin:0;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bring{display:flex;flex-wrap:wrap;gap:8px}
.bring label{display:inline-flex;flex-direction:row;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;cursor:pointer}
.bring input{width:20px;height:20px;padding:0;accent-color:var(--ok)}
.bring label.ok{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.qs{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px}

.empty{text-align:center;color:var(--muted);padding:28px 10px;background:var(--surface);border-radius:20px}
.examples{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 14px}
.link{background:none;border:0;color:var(--accent);font-weight:800;padding:4px 0;text-decoration:underline}

.settings{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:20px;padding:16px 18px}
.settings h3{font-size:18px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{font-size:14px;color:var(--muted);margin:0}
.switch{width:58px;height:34px;border-radius:99px;border:0;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{inset-inline-start:28px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--med-soft);color:var(--med)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:21px;font-weight:600;padding:16px 28px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(79,70,229,.4);z-index:5;white-space:nowrap}

/* Formulaire */
.scrim{position:fixed;inset:0;background:rgba(10,12,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:26px;font-weight:600}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type{border:3px solid transparent;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px}
.type.med{background:var(--med-soft);color:var(--med)} .type.rdv{background:var(--rdv-soft);color:var(--rdv)} .type.tache{background:var(--tache-soft);color:var(--tache)}
.type[aria-pressed="true"]{border-color:currentColor}
.fl{font-weight:800;font-size:15px;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:80px;resize:vertical}
input[type="time"]{font-family:"Fredoka",var(--f-display);font-size:24px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px}
.seg button{border:0;border-radius:10px;padding:10px;background:none;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.box{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.box h3{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.box.med h3{color:var(--med)} .box.rdv h3{color:var(--rdv)} .box.voice h3{color:var(--ok)}
.sheet:not([data-type="med"]) .only-med{display:none}
.sheet:not([data-type="rdv"]) .only-rdv{display:none}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sug button{border:2px dashed var(--line);background:none;border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.sug button[aria-pressed="true"]{border-style:solid;border-color:var(--rdv);background:var(--rdv-soft);color:var(--rdv)}
.addrow{display:flex;gap:8px}
.addrow .mini{background:var(--surface-2)}
.vstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:800;padding:12px 16px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.err{color:var(--late);font-weight:700;font-size:15px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* Alerte plein écran */
.alert{position:fixed;inset:0;z-index:30;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;color:var(--on-color);padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--accent)}
.alert.med{background:var(--med)} .alert.rdv{background:var(--rdv)} .alert.tache{background:var(--tache)} .alert.pri{background:var(--pri)}
.ring{width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{transform:scale(1.06);box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.alert small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.alert h2{font-size:clamp(30px,9vw,44px);font-weight:600;line-height:1.1;max-width:18ch;overflow-wrap:anywhere}
.alert .when{font-family:"Fredoka",var(--f-display);font-size:28px;font-weight:600}
.alert .note{font-size:18px;font-weight:700;max-width:32ch}
.alert .from{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 16px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.alert .abring{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.alert .abring label{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
.alert .abring input{width:20px;height:20px;accent-color:#fff}
.alert .actions{width:100%;max-width:420px;flex-direction:column}
.alert .btn{font-size:20px;padding:18px;background:rgba(255,255,255,.25);color:inherit}
.alert .btn.big{background:#fff;color:#1D2142;font-size:22px}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.bar i{transition:none}}
@media (max-width:420px){.main{grid-template-columns:52px 42px 1fr 48px;gap:9px}.bubble{width:42px;height:42px}.t{font-size:18px}.three{grid-template-columns:1fr 1fr}}

/* ================= Nouvelle apparence : ciel du jour + couleurs vives ================= */
:root{
  --bg:#F5F3FC; --line:#E4E1F3; --surface-2:#EFEDF9;
  --accent:#5B3FE0; --accent-1:#9B5CF6;
  --med-1:#FF7A98; --rdv-1:#4FB4FF; --tache-1:#FFC046; --pri-1:#2ED3B7; --ok-1:#3DDC97;
  --card-shadow:0 2px 12px rgba(60,40,140,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100F24; --surface:#1B1A38; --surface-2:#252347; --line:#302D5C;
  --accent:#9B87FF; --accent-1:#D08CFF;
  --med-1:#FF9DB4; --rdv-1:#8CD0FF; --tache-1:#FFD27A; --pri-1:#7EEBD9; --ok-1:#7DEBB8; --card-shadow:0 2px 12px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#100F24; --surface:#1B1A38; --surface-2:#252347; --line:#302D5C;
  --accent:#9B87FF; --accent-1:#D08CFF;
  --med-1:#FF9DB4; --rdv-1:#8CD0FF; --tache-1:#FFD27A; --pri-1:#7EEBD9; --ok-1:#7DEBB8; --card-shadow:0 2px 12px rgba(0,0,0,.35)}

/* Ciel : la couleur suit le moment de la journée */
.sky{position:relative;overflow:hidden;border-radius:30px;padding:16px 18px 22px;color:#fff;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px rgba(60,40,140,.22);isolation:isolate;transition:background .8s}
.sky[data-p="night"]{background:linear-gradient(165deg,#191C4F 0%,#3B2A78 60%,#5B3A8F 100%)}
.sky[data-p="dawn"]{background:linear-gradient(165deg,#5B4BB7 0%,#E5679A 55%,#FFB07A 100%)}
.sky[data-p="day"]{background:linear-gradient(165deg,#1E88E5 0%,#35B6F0 55%,#7FD8F5 100%)}
.sky[data-p="golden"]{background:linear-gradient(165deg,#F27D4A 0%,#FFA845 55%,#FFD36E 100%)}
.sky[data-p="sunset"]{background:linear-gradient(165deg,#3E2C7A 0%,#C2457E 50%,#FF8A5B 100%)}
.sky .orb{position:absolute;z-index:-1;width:150px;height:150px;border-radius:50%;inset-inline-end:-28px;bottom:-46px;transition:.8s}
.sky[data-p="day"] .orb,.sky[data-p="golden"] .orb{background:radial-gradient(circle,#FFF6C8 0%,#FFE27A 38%,rgba(255,226,122,0) 70%)}
.sky[data-p="dawn"] .orb,.sky[data-p="sunset"] .orb{background:radial-gradient(circle,#FFE3B0 0%,#FFB36B 35%,rgba(255,150,90,0) 70%);bottom:-80px}
.sky[data-p="night"] .orb{width:40px;height:40px;inset-inline-end:28px;bottom:16px;background:transparent;box-shadow:11px -7px 0 0 #F4EFD8;opacity:.95}
.sky .stars{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .8s;background-image:radial-gradient(1.5px 1.5px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 62% 58%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 42%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 88%,#fff 50%,transparent 51%)}
.sky[data-p="night"] .stars{opacity:.9} .sky[data-p="dawn"] .stars,.sky[data-p="sunset"] .stars{opacity:.35}
.sky .brand{color:#fff}
.sky .brand .logo{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.sky .langs{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.sky .langs button{color:rgba(255,255,255,.85);padding:6px 10px}
.sky .brand{font-size:22px}
.sky .brand .logo{width:30px;height:30px}
.sky .langs button[aria-pressed="true"]{background:#fff;color:#2A1F66}
.sky .day{color:rgba(255,255,255,.88)}
.sky .date{color:#fff}
.sky .clock{color:#fff;font-size:44px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.12)}
.greet{font-family:"Fredoka",var(--f-display);font-weight:600;font-size:17px;color:rgba(255,255,255,.95);margin-top:-6px}
:root[lang="ar"] .greet{font-family:var(--f-display)}

/* Cartes */
.item,.settings,.prayers,.examples{box-shadow:var(--card-shadow)}
.next{position:relative;overflow:hidden;isolation:isolate;box-shadow:0 12px 28px rgba(60,40,140,.20)}
.next::after{content:"";position:absolute;z-index:-1;width:170px;height:170px;border-radius:50%;inset-inline-end:-50px;top:-60px;background:rgba(255,255,255,.14)}
.next::before{content:"";position:absolute;z-index:-1;width:90px;height:90px;border-radius:50%;inset-inline-end:40px;bottom:-50px;background:rgba(255,255,255,.10)}
.next.med{background:linear-gradient(135deg,var(--med) 0%,var(--med-1) 100%)}
.next.rdv{background:linear-gradient(135deg,var(--rdv) 0%,var(--rdv-1) 100%)}
.next.tache{background:linear-gradient(135deg,var(--tache) 0%,var(--tache-1) 100%)}
.next.pri{background:linear-gradient(135deg,var(--pri) 0%,var(--pri-1) 100%)}
.next.allok{background:linear-gradient(135deg,var(--ok) 0%,var(--ok-1) 100%)}

/* Bulles d'icônes en couleur pleine */
.med .bubble{background:linear-gradient(145deg,var(--med),var(--med-1));color:var(--on-color)}
.rdv .bubble{background:linear-gradient(145deg,var(--rdv),var(--rdv-1));color:var(--on-color)}
.tache .bubble{background:linear-gradient(145deg,var(--tache),var(--tache-1));color:var(--on-color)}
.pri .bubble{background:linear-gradient(145deg,var(--pri),var(--pri-1));color:var(--on-color)}
.bubble{box-shadow:0 4px 10px rgba(60,40,140,.15)}
.item.done{box-shadow:none}

/* Filtres colorés */
.chip[data-f="med"][aria-pressed="true"]{background:var(--med);border-color:var(--med);color:var(--on-color)}
.chip[data-f="rdv"][aria-pressed="true"]{background:var(--rdv);border-color:var(--rdv);color:var(--on-color)}
.chip[data-f="tache"][aria-pressed="true"]{background:var(--tache);border-color:var(--tache);color:var(--on-color)}
.chip[data-f="pri"][aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-color)}
.chip[data-f="all"][aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-1));border-color:transparent;color:var(--accent-ink)}

/* Progression, prières, bouton principal */
.bar i{background:linear-gradient(90deg,var(--ok),var(--pri-1))}
.prc.nx{background:linear-gradient(145deg,var(--pri),var(--pri-1));box-shadow:0 4px 12px rgba(11,127,122,.3)}
.stock{background:linear-gradient(135deg,var(--warn-soft),var(--med-soft))}
.fab{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-1) 100%);box-shadow:0 12px 30px rgba(91,63,224,.45)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-1))}
.unlock{border-color:var(--accent-1);background:linear-gradient(135deg,var(--surface),var(--surface-2))}
.unlock .ico{background:linear-gradient(145deg,var(--accent),var(--accent-1))}
.switch[aria-checked="true"]{background:linear-gradient(90deg,var(--ok),var(--pri-1))}
.alert.med{background:linear-gradient(160deg,var(--med),var(--med-1))}
.alert.rdv{background:linear-gradient(160deg,var(--rdv),var(--rdv-1))}
.alert.tache{background:linear-gradient(160deg,var(--tache),var(--tache-1))}
.alert.pri{background:linear-gradient(160deg,var(--pri),var(--pri-1))}
@media (prefers-reduced-motion:reduce){.sky,.sky .orb,.sky .stars{transition:none}}
</style>

const dtr = d => d*Math.PI/180, rtd = r => r*180/Math.PI;
const sinD = d => Math.sin(dtr(d)), cosD = d => Math.cos(dtr(d)), tanD = d => Math.tan(dtr(d));
const asinD = x => rtd(Math.asin(x)), acosD = x => rtd(Math.acos(x)), atan2D = (y,x) => rtd(Math.atan2(y,x)), acotD = x => rtd(Math.atan(1/x));
const fixA = a => a - 360*Math.floor(a/360), fixH = h => h - 24*Math.floor(h/24);
function julian(y, m, d){ if (m <= 2){ y -= 1; m += 12; } const A = Math.floor(y/100), B = 2 - A + Math.floor(A/4); return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5; }
function sunPos(jd){
  const D = jd - 2451545, g = fixA(357.529 + 0.98560028*D), q = fixA(280.459 + 0.98564736*D);
  const L = fixA(q + 1.915*sinD(g) + 0.020*sinD(2*g)), e = 23.439 - 0.00000036*D;
  const RA = atan2D(cosD(e)*sinD(L), cosD(L)) / 15;
  return {decl: asinD(sinD(e)*sinD(L)), eqt: q/15 - fixH(RA)};
}
/* Renvoie les horaires en minutes depuis minuit, à l'heure du téléphone */
function prayerTimes(date, lat, lng, mk, asrF){
  const m = METHODS[mk] || METHODS.mwl;
  const jd = julian(date.getFullYear(), date.getMonth()+1, date.getDate()) - lng/(15*24);
  const tz = -new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).getTimezoneOffset()/60;
  const midDay = t => fixH(12 - sunPos(jd+t).eqt);
  const angTime = (a, t, ccw) => { const s = sunPos(jd+t), n = midDay(t); const v = (-sinD(a) - sinD(s.decl)*sinD(lat)) / (cosD(s.decl)*cosD(lat)); if (v < -1 || v > 1) return NaN; const d = acosD(v)/15; return n + (ccw ? -d : d); };
  const asrT = (f, t) => { const s = sunPos(jd+t); return angTime(-acotD(f + tanD(Math.abs(lat - s.decl))), t); };
  const init = {fajr:5, sunrise:6, dhuhr:12, asr:13, sunset:18, isha:18};
  let T = {...init};
  for (let k = 0; k < 2; k++){
    const p = {}; for (const x in T) p[x] = (isNaN(T[x]) ? init[x] : T[x]) / 24;
    T = {fajr:angTime(m.f, p.fajr, true), sunrise:angTime(0.833, p.sunrise, true), dhuhr:midDay(p.dhuhr), asr:asrT(asrF, p.asr), sunset:angTime(0.833, p.sunset), isha:m.im ? NaN : angTime(m.i, p.isha)};
  }
  const adj = tz - lng/15; for (const x in T) T[x] += adj;
  const night = 24 - T.sunset + T.sunrise;              // règle des latitudes élevées (angle)
  const fp = m.f/60*night; if (isNaN(T.fajr) || T.sunrise - T.fajr > fp) T.fajr = T.sunrise - fp;
  if (m.im) T.isha = T.sunset + m.im/60;
  else { const ip = m.i/60*night; if (isNaN(T.isha) || T.isha - T.sunset > ip) T.isha = T.sunset + ip; }
  T.maghrib = T.sunset;
  const out = {}; for (const x of ['fajr','sunrise','dhuhr','asr','maghrib','isha']) out[x] = Math.round(T[x]*60);
  return out;
}

    o.connect(g).connect(out); o.start(at); o.stop(at + dur + 0.05);

      <div><small>${t('today')}</small><h2>${list.length && !left ? t('allDone') : t('nothingLeft')}</h2><p>${left ? t('lateLeft',{n:left}) : t('enjoy')}</p></div>`;
  }
}
function renderStock(){
  const keys = [...new Set(state.items.filter(i=>i.type==='med').map(i=>i.stockKey))];
  const low = keys.map(k => [k, stockInfo(k)]).filter(([k,s]) => s && s.low);
  const el = $('#stock'); el.hidden = !low.length;
  if (!low.length) return;
  el.innerHTML = `<h3><svg width="22" height="22"><use href="#i-box"/></svg>${t('stockBanner')}</h3>` + low.map(([k,s]) => {
    const it = state.items.find(i=>i.type==='med'&&i.stockKey===k);
    return `<div class="srow"><div><b>${esc(title(it))}</b><br><span>${t('stockRow',{n:s.qty,d:s.days})}</span></div><button class="mini" data-buy="${esc(k)}">${t('bought',{n:s.box})}</button></div>`;
  }).join('');
}
function render(){
  renderClock(); renderNext(); renderPrayers(); renderStock();
  const list = todays(), nx = nextItem(), nm = Math.floor(nowMin());
  const done = list.filter(isDone).length;
  $('#prog').textContent = t('progress',{d:done, n:list.length});
  $('#barfill').style.width = list.length ? (done/list.length*100)+'%' : '0';
  $('#examples').hidden = !state.items.some(i=>i.ex);
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f===filter));
  const shown = list.filter(i => filter==='all' || i.type===filter);
  const ul = $('#list');
  if (!shown.length){ ul.innerHTML = `<li class="empty">${t('empty')}</li>`; return; }
  ul.innerHTML = shown.map(it => {
    const d = isDone(it), late = !d && toMin(it.time) < nm, isNx = nx && nx.id===it.id;
    const tags = [];
    if (late) tags.push(`<span class="tag late">${t('late')}</span>`);
    if (isNx) tags.push(`<span class="tag nx">${t('nextTag')}</span>`);
    if (it.type==='med'){ const si = stockInfo(it.stockKey); if (si) tags.push(`<span class="tag ${si.low?'low':'stk'}">${si.low?t('buy')+' · ':''}${t('left',{n:si.qty})}</span>`); }
    if (it.hasVoice) tags.push(`<span class="tag vox"><svg width="12" height="12"><use href="#i-heart"/></svg>${esc(t('voiceTag',{n: it.ex ? EX[L()].from : (it.voiceFrom||t('voiceSome'))}))}</span>`);
    const meta = [t(it.type), it.repeat==='daily'?t('daily'):null, it.adv>0?t('before',{x:t('x'+it.adv)}):null, it.snooze?t('snoozed'):null].filter(Boolean).join(' · ');
    let prep = '';
    if (it.type==='rdv'){
      const b = it.bring||[], okc = b.filter(x=>x.ok).length, lm = leaveMin(it), open = expanded.has(it.id);
      const parts = []; if (b.length) parts.push(t('ready',{a:okc,b:b.length})); if (lm!=null) parts.push(t('leaveAt',{t:fmtTime(fromMin(lm))}));
      if (parts.length || questions(it) || place(it)){
        prep = `<div class="prepbar"><span>${parts.join(' · ') || esc(place(it))}</span><button class="mini" data-exp="${it.id}" aria-expanded="${open}">${open?t('hide'):t('prep')}</button></div>`;
        if (open) prep += `<div class="prep">
          ${place(it)?`<div><h4>${t('place')}</h4><div>${esc(place(it))}</div></div>`:''}
          ${b.length?`<div><h4>${t('bring')}</h4><div class="bring">${b.map((x,i)=>`<label class="${x.ok?'ok':''}"><input type="checkbox" data-bring="${it.id}:${i}" ${x.ok?'checked':''}>${esc(bringLabel(x))}</label>`).join('')}</div></div>`:''}
          ${questions(it)?`<div><h4>${t('questions')}</h4><div class="qs">${esc(questions(it))}</div></div>`:''}
        </div>`;
      }
    }
    return `<li class="item ${it.type} ${d?'done':''} ${isNx?'isnext':''}">
      <div class="main">
        <div class="t" dir="ltr">${it.time}</div>
        <div class="bubble"><svg width="26" height="26"><use href="#i-${it.type}"/></svg></div>
        <button class="body" data-edit="${it.id}">
          <div class="ttl">${esc(title(it))}</div>
          <div class="meta">${tags.join('')}<span>${esc(meta)}</span></div>
          ${note(it)?`<div class="meta">${esc(note(it))}</div>`:''}
        </button>
        <button class="check" data-check="${it.id}" aria-label="${esc(title(it))}" aria-pressed="${d}"><svg width="24" height="24"><use href="#i-check"/></svg></button>
      </div>${prep}
    </li>`;
  }).join('');
}

function renderSug(){
  const sugBtns = SUG.map(k => `<button type="button" data-sug="${k}" aria-pressed="${formBring.some(b=>b.k===k)}">${t(k)}</button>`);
  const custom = formBring.filter(b=>!b.k).map((b,i) => `<button type="button" data-cus="${i}" aria-pressed="true">${esc(b.label)} ✕</button>`);
  $('#sug').innerHTML = sugBtns.concat(custom).join('');
}
$('#sug').addEventListener('click', e => {
  const s = e.target.closest('[data-sug]'), c = e.target.closest('[data-cus]');
  if (s){ const k = s.dataset.sug, i = formBring.findIndex(b=>b.k===k); i>=0 ? formBring.splice(i,1) : formBring.push({k, ok:false}); renderSug(); }
  if (c){ const customs = formBring.filter(b=>!b.k); const target = customs[c.dataset.cus]; formBring = formBring.filter(b=>b!==target); renderSug(); }

function addBring(){ const v = $('#f-bring').value.trim(); if (v){ formBring.push({label:v, ok:false}); $('#f-bring').value=''; renderSug(); } }

function renderVoice(){
  const has = formVoice instanceof Blob || (formVoice==='keep');
  $('#vstate').innerHTML = (has ? `<span>${t('voiceReady')}</span><button type="button" class="mini" id="vplay">${t('voicePlay')}</button><button type="button" class="mini" id="vrem">${t('voiceRemove')}</button>` : '')

$('#vstate').addEventListener('click', async e => {
  if (e.target.id==='vplay'){ unlockAudio(); if (formVoice instanceof Blob){ stopSound(); clip = new Audio(URL.createObjectURL(formVoice)); clip.play().catch(()=>{}); } else if (editing) playClip(editing.id); }
  if (e.target.id==='vrem'){ stopSound(); formVoice = 'remove'; renderVoice(); }
});
$('#vstate').addEventListener('change', e => {
  if (e.target.id!=='f-audio') return;
  const f = e.target.files && e.target.files[0], err = $('#verr'); err.hidden = true;
  if (!f) return;
  if (f.type && !f.type.startsWith('audio') && !/\.(m4a|mp3|ogg|opus|wav|aac|amr|3gp|webm)$/i.test(f.name)){ err.textContent = t('voiceBad'); err.hidden = false; return; }
  if (f.size > 10*1024*1024){ err.textContent = t('voiceTooBig'); err.hidden = false; return; }

function openForm(it){
  editing = it || null;
  $('#formTitle').textContent = it ? t('editR') : t('newR');
  $('#f-title').value = it ? title(it) : '';
  const d = new Date(Date.now()+60*60000);
  $('#f-time').value = it ? it.time : pad(d.getHours())+':00';
  $('#f-adv').value = it ? String(it.adv||0) : '0';
  $('#f-note').value = it ? note(it) : '';
  setType(it ? it.type : 'med'); setRepeat(it ? it.repeat : 'once');
  const s = it && it.type==='med' ? state.stocks[it.stockKey] : null;
  $('#f-dose').value = it && it.dose!=null ? it.dose : 1;
  $('#f-qty').value = s && s.qty!=null ? s.qty : '';
  $('#f-boxsz').value = s && s.box ? s.box : 30;
  $('#f-place').value = it ? place(it) : '';
  $('#f-travel').value = it && it.travel ? it.travel : '';
  $('#f-qs').value = it ? questions(it) : '';
  formBring = it && it.bring ? it.bring.map(b => ({...b})) : [];
  $('#f-from').value = it ? (it.ex ? (it.hasVoice?EX[L()].from:'') : (it.voiceFrom||'')) : '';
  formVoice = it && it.hasVoice ? 'keep' : null; $('#verr').hidden = true;
  renderSug(); renderVoice();
  const del = $('#del'); del.hidden = !it; del.textContent = t('del'); del.dataset.armed = '';
  $('#scrim').hidden = false;

}

$('#del').onclick = () => {
  const b = $('#del');
  if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = t('delConfirm'); return; }
  if (editing.hasVoice) vDel(editing.id);
  state.items = state.items.filter(i => i.id !== editing.id); save(); closeForm(); render();
};
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const ttl = $('#f-title').value.trim(), time = $('#f-time').value;
  if (!ttl || !time) return;
  const it = editing || {id:uid(), date:todayKey()};
  const wasDone = editing && isDone(editing);
  Object.assign(it, {type:formType, title:ttl, time, repeat:formRepeat, adv:Number($('#f-adv').value), note:$('#f-note').value.trim(), voiceFrom:$('#f-from').value.trim()});
  if (!editing) it.date = todayKey();
  if (formType==='med'){
    it.dose = Number($('#f-dose').value)||1;
    it.stockKey = it.ex ? it.stockKey : norm(ttl);
    const q = $('#f-qty').value;
    if (q!==''){ state.stocks[it.stockKey] = {qty:Number(q), box:Number($('#f-boxsz').value)||30}; }
  }
  if (formType==='rdv'){
    it.place = $('#f-place').value.trim(); it.travel = Number($('#f-travel').value)||0;
    it.questions = $('#f-qs').value.trim(); it.bring = formBring;
  }
  if (formVoice instanceof Blob){ const ok = await vPut(it.id, formVoice); it.hasVoice = !!ok; }
  else if (formVoice==='remove'){ await vDel(it.id); it.hasVoice = false; }
  if (it.ex) delete it.ex;
  if (!editing) state.items.push(it);
  if (wasDone) it.doneOn = todayKey();
  const nm = nowMin();
  if (alertMin(it) <= nm-1) state.fired[fkey(it,'main')] = true;
  const lm = leaveMin(it); if (lm!=null && lm <= nm-1) state.fired[fkey(it,'leave')] = true;
  save(); closeForm(); render();
});

function renderPrayers(){
  const el = $('#prayers'), on = state.pri && state.pri.on;
  el.hidden = !on; if (!on) return;
  const now = new Date(), cfg = prCfg(), ps = prayersFor(now), nm = Math.floor(nowMin());
  const tm = prayerTimes(now, cfg.city[1], cfg.city[2], cfg.mk, cfg.af), off = Number(state.pri.off)||0;
  const nx = ps.find(p => toMin(p.time) >= nm && !isDone(p));
  el.innerHTML = `<div class="prhead"><h3><svg width="22" height="22"><use href="#i-pri"/></svg>${t('priTitle')}</h3><span>${esc(cfg.city[0])} · ${t('c_'+state.pri.country)}</span></div>
    <div class="prgrid">${ps.map(p => `<div class="prc ${nx && nx.key===p.key ? 'nx' : ''} ${toMin(p.time) < nm || isDone(p) ? 'past' : ''}"><b>${t('p_'+p.key)}</b><span dir="ltr">${p.time}</span></div>`).join('')}</div>
    <div class="prfoot">${t('sunrise',{t:fromMin(tm.sunrise+off)})} · ${t('m_'+cfg.mk)}</div>`;
}
function opt(v, label, sel){ return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(label)}</option>`; }
function renderPrSettings(){
  const p = state.pri, c = COUNTRIES[p.country] || COUNTRIES.FR;
  $('#sw-pri').setAttribute('aria-checked', p.on);
  $('#prOpts').style.display = p.on ? 'grid' : 'none';
  $('#prHint').hidden = !p.on;
  $('#pr-country').innerHTML = Object.keys(COUNTRIES).map(k => opt(k, t('c_'+k), p.country)).join('');
  $('#pr-city').innerHTML = c.c.map((x,i) => opt(i, x[0], p.city)).join('');
  $('#pr-method').innerHTML = opt('auto', t('mAuto')+' · '+t('m_'+c.m), p.method) + Object.keys(METHODS).map(k => opt(k, t('m_'+k), p.method)).join('');
  $('#pr-asr').innerHTML = opt('auto', t('mAuto'), p.asr) + opt(1, t('asrStd'), p.asr) + opt(2, t('asrHan'), p.asr);
  $('#pr-adv').innerHTML = [0,5,10,15,30].map(v => opt(v, v ? t('m'+v) : t('atTime'), p.adv)).join('');

Object.assign(T.fr, {callTitle:"Annonce de la prière", callAdhan:"Adhan", callPhrase:"Phrase courte", fajrPhrase:"Pour le Fajr, dire « الصلاة خير من النوم »", noArVoice:"Si la voix arabe ne parle pas, installez l'arabe dans les réglages « synthèse vocale » du téléphone. En attendant, la traduction est lue."});

const hasArVoice = () => { try { return speechSynthesis.getVoices().some(v => v.lang && v.lang.toLowerCase().startsWith('ar')); } catch(e){ return false; } };
function speakCall(it){
  if (!state.settings.voice || !('speechSynthesis' in window)) return;
  const c = CALLS[callKey(it)];
  const voices = (() => { try { return speechSynthesis.getVoices(); } catch(e){ return []; } })();
  if (hasArVoice() || !voices.length){

      const u = new SpeechSynthesisUtterance(c.ar + '، صلاة ' + PR_AR[it.key]);
      u.lang = 'ar-SA'; u.rate = 0.85;
      const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')); if (v) u.voice = v;
      speechSynthesis.speak(u);

  } else speak((c[L()] || c.fr) + '. ' + title(it) + '.');

  const sel = p.phrase || 'wakt', tr = k => L()==='ar' ? '' : (CALLS[k][L()] || CALLS[k].fr);
  box.innerHTML = ['wakt','tansa','istaid'].map(k => `<label class="ph ${k===sel?'on':''}"><input type="radio" name="callph" value="${k}" ${k===sel?'checked':''}>
      <span class="phtxt"><b lang="ar" dir="rtl">${CALLS[k].ar}</b>${tr(k)?`<small>${esc(tr(k))}</small>`:''}</span>
      <button type="button" class="mini" data-say="${k}">${t('voicePlay')}</button></label>`).join('')

      <button type="button" class="mini" data-say="fajr">${t('voicePlay')}</button>
      <button type="button" class="switch" id="sw-fajr" role="switch" aria-checked="${p.fajrPhrase !== false}" aria-label="Fajr"></button></div>`
    + (hasArVoice() ? '' : `<p class="hint">${t('noArVoice')}</p>`);
}

    const k = s.dataset.say, it = {type:'pri', key: k==='fajr' ? 'fajr' : 'dhuhr', adv:0};

<script>
/* RappelMe — couche native Android (Capacitor)
   Programme de vraies notifications système qui sonnent même téléphone verrouillé.
   Sur un simple navigateur, ce fichier ne fait rien. */
(function () {
  const Cap = window.Capacitor;
  if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return;
  const LN = Cap.Plugins && Cap.Plugins.LocalNotifications;
  if (!LN) return;

  const DAYS_AHEAD = 7;                 // on programme les 7 prochains jours
  const KINDS = { main: 0, leave: 1, snooze: 2 };

  function baseHash(id) {
    let h = 0;
    for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0;
    return Math.abs(h) % 100000;
  }
  const nid = (id, kind, day) => baseHash(id) * 100 + day * 4 + KINDS[kind] + 1;

  function dayStart(offset) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d; }
  // heure locale exacte, même les jours de changement d'heure
  const atMin = (d0, min) => new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), 0, min);
  function dateFromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }

  function buildList() {
    const now = Date.now(), out = [];
    const push = (it, kind, at, day) => {
      if (at.getTime() <= now + 5000) return;
      out.push({
        id: nid(it.id, kind, day),
        title: kind === 'leave' ? t('leaveNow') : (it.type === 'pri' ? t('pri') + ' ' + title(it) : t(it.type)) + ' · ' + fmtTime(it.time),
        body: phrase({ it, kind: kind === 'leave' ? 'leave' : 'main' }),
        schedule: { at, allowWhileIdle: true },
        channelId: 'rappels',
        actionTypeId: 'RAPPEL',
        extra: { id: it.id, kind: kind === 'leave' ? 'leave' : 'main' }
      });
    };
    for (const it of state.items) {
      const days = it.repeat === 'daily'
        ? Array.from({ length: DAYS_AHEAD }, (_, i) => [i, dayStart(i)])
        : [[0, dateFromKey(it.date || todayKey())]];
      for (const [i, d0] of days) {
        if (i === 0 && isDone(it)) continue;
        const main = atMin(d0, alertMin(it));
        push(it, 'main', main, i);
        const lm = leaveMin(it);
        if (lm != null && lm !== alertMin(it)) push(it, 'leave', atMin(d0, lm), i);
      }
      if (it.snooze && !isDone(it)) push(it, 'snooze', new Date(it.snooze), 0);
    }
    // Prières : horaires recalculés pour chacun des prochains jours
    for (let i = 0; i < DAYS_AHEAD; i++) {
      const d0 = dayStart(i);
      for (const it of prayersFor(d0)) {
        if (i === 0 && isDone(it)) continue;
        push(it, 'main', atMin(d0, alertMin(it)), i);
        if (i === 0 && it.snooze) push(it, 'snooze', new Date(it.snooze), 0);
      }
    }
    return out;
  }

  let lastSig = '', timer = null;
  async function scheduleAll() {
    try {
      const list = buildList();
      const sig = JSON.stringify(list.map(n => [n.id, n.schedule.at.getTime(), n.body, n.title]));
      if (sig === lastSig) return;
      lastSig = sig;
      const pending = await LN.getPending();
      if (pending.notifications && pending.notifications.length) {
        await LN.cancel({ notifications: pending.notifications.map(n => ({ id: n.id })) });
      }
      if (list.length) await LN.schedule({ notifications: list });
    } catch (e) { console.warn('Programmation des rappels impossible', e); }
  }
  const later = () => { clearTimeout(timer); timer = setTimeout(scheduleAll, 800); };

  // Chaque enregistrement reprogramme les notifications
  const origSave = window.save;
  window.save = function () { origSave(); later(); };

  async function registerTypes() {
    try {
      await LN.registerActionTypes({ types: [{ id: 'RAPPEL', actions: [
        { id: 'done', title: t('done') },
        { id: 'snooze', title: t('snooze') }
      ] }] });
    } catch (e) {}
  }

  async function init() {
    try { await LN.requestPermissions(); } catch (e) {}
    try {
      await LN.createChannel({ id: 'rappels', name: 'Rappels', description: 'Médicaments, rendez-vous et tâches',
        importance: 5, visibility: 1, vibration: true, lights: true, lightColor: '#4F46E5' });
    } catch (e) {}
    try {
      // Android 12+ : autoriser les alarmes exactes pour sonner à l'heure pile
      if (LN.checkExactNotificationSetting) {
        const s = await LN.checkExactNotificationSetting();
        if (s && s.exact_alarm && s.exact_alarm !== 'granted' && LN.changeExactNotificationSetting) {
          await LN.changeExactNotificationSetting();
        }
      }
    } catch (e) {}
    await registerTypes();

    // Notification reçue pendant que l'application est ouverte : écran d'alerte
    LN.addListener('localNotificationReceived', n => {
      const ex = n.extra || {}, it = getItem(ex.id);
      if (!it) return;
      state.fired[fkey(it, ex.kind)] = true;
      fire(it, ex.kind);
    });
    // Bouton touché sur la notification (même téléphone verrouillé)
    LN.addListener('localNotificationActionPerformed', ev => {
      const ex = (ev.notification && ev.notification.extra) || {}, it = getItem(ex.id);
      if (!it) return;
      if (ev.actionId === 'done') { setDone(it, true); save(); render(); }
      else if (ev.actionId === 'snooze') { setSnooze(it, Date.now() + 10 * 60000); save(); render(); }
      else { unlockAudio(); state.fired[fkey(it, ex.kind)] = true; fire(it, ex.kind); } // ouverture : voix du proche
    });

    // Langue changée : met à jour les boutons des notifications
    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { registerTypes(); later(); }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); later(); } });

    scheduleAll();
  }
  init();
})();
</script>
